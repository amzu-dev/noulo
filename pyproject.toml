[project]
name = "noulo"
version = "0.1.0"
description = "Local, CPU-only semantic decision engine: Choice, Score and Noul primitives over a quantised NLI model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "httpx>=0.27",
    "prompt_toolkit>=3.0.43",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
benchmark = ["psutil>=5.9"]
qdrant = ["qdrant-client>=1.9"]
chroma = ["chromadb>=0.5"]

[project.scripts]
noulo = "noulo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "psutil>=5.9",
    "ruff>=0.5",
    "qdrant-client>=1.9",
    "chromadb>=0.5",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noulo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
markers = [
    "model: requires a downloaded ONNX model under ./models (skipped otherwise)",
    "slow: slower end-to-end tests (real server subprocess)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's Depends() idiom; B905: zips over deliberately offset sequences
ignore = ["B008", "B905"]
